# Mosquitto 2.x for local / Kubernetes use. Shared subscriptions ($share/...) are built in.
listener 1883
protocol mqtt
allow_anonymous true

# 1,000+ terminal connections and bursts of QoS 1 traffic.
max_connections -1
max_inflight_messages 1000
max_queued_messages 200000
persistence false
log_dest stdout
log_type error
log_type warning
