# Baseline fleet: 1,000 terminals publishing at ~1,700 txn/s (plus heartbeats).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
spec:
  replicas: 1
  selector:
    matchLabels: { app: simulator }
  template:
    metadata:
      labels: { app: simulator }
    spec:
      containers:
        - name: simulator
          image: terminalpulse/app
          command: ["node", "services/simulator/dist/index.js"]
          env:
            - { name: MQTT_URL, value: "mqtt://mosquitto:1883" }
            - { name: SIM_TERMINALS, value: "1000" }
            - { name: SIM_RATE, value: "1700" }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
