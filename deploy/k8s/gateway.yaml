# Stateless ingest + persist workers. Each pod opens MQTT_INGEST_CONNECTIONS connections in the
# $share/tp-gateway group and joins the tp-persisters Redis consumer group, so adding pods spreads
# both MQTT delivery and stream processing with no coordination.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: gateway
          image: terminalpulse/app
          envFrom:
            - configMapRef: { name: terminalpulse-config }
          env:
            - { name: ROLES, value: "ingest,persist" }
            - name: INSTANCE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: MQTT_INGEST_CONNECTIONS, value: "4" }
            - { name: PERSIST_CONCURRENCY, value: "2" }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 125m, memory: 160Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - { type: Pods, value: 2, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 120
