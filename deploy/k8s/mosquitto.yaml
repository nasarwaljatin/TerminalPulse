apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
data:
  mosquitto.conf: |
    listener 1883
    protocol mqtt
    allow_anonymous true
    max_connections -1
    max_inflight_messages 1000
    max_queued_messages 200000
    persistence false
    log_dest stdout
    log_type error
    log_type warning
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
spec:
  replicas: 1
  selector:
    matchLabels: { app: mosquitto }
  template:
    metadata:
      labels: { app: mosquitto }
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.20
          ports: [{ containerPort: 1883 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /mosquitto/config }
      volumes:
        - name: config
          configMap: { name: mosquitto-config }
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
spec:
  selector: { app: mosquitto }
  ports: [{ port: 1883 }]
