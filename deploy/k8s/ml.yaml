apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml
spec:
  replicas: 1
  selector:
    matchLabels: { app: ml }
  template:
    metadata:
      labels: { app: ml }
    spec:
      containers:
        - name: ml
          image: terminalpulse/ml
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ml
spec:
  selector: { app: ml }
  ports: [{ port: 8000 }]
